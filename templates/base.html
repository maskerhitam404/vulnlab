<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IFSEC LAB - Pelatihan Cybersecurity{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            900: '#0a1128',
                            800: '#121e3f',
                            700: '#1c2d5c',
                        },
                        brand: {
                            blue: '#3b82f6',
                            accent: '#38bdf8'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased flex flex-col min-h-screen">

    <!-- Navbar Tema Navy -->
    <nav class="bg-navy-900 border-b border-navy-700 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center gap-3 cursor-pointer" onclick="window.location.href='/'">
                    <div class="w-10 h-10 bg-brand-blue rounded flex justify-center items-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
                    </div>
                    <div>
                        <span class="text-white text-xl font-bold tracking-wider block leading-none">IFSEC</span>
                        <span class="text-brand-accent text-xs font-semibold tracking-widest uppercase">Lab Academy</span>
                    </div>
                </div>
                
                <!-- Menu Kanan -->
                <div class="hidden md:flex space-x-8 items-center">
                    <a href="/" class="text-gray-300 hover:text-white transition duration-300 font-medium {{ 'text-white' if request.path == '/' else '' }}">Beranda</a>
                    
                    <!-- Dropdown Kategori -->
                    <div class="relative group">
                        <button class="text-gray-300 hover:text-white transition duration-300 flex items-center font-medium">
                            Modul Serangan <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <div class="absolute left-0 mt-2 w-56 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 hidden group-hover:block transition-all">
                            <div class="py-1">
                                <!-- PERBAIKAN DI SINI -->
                                {% for cat in CATEGORIES %}
                                <a href="{{ url_for('category', slug=cat.slug) }}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">{{ cat.name }}</a>
                                {% endfor %}
                            </div>
                        </div>
                    </div>
                    
                    
                </div>
            </div>
        </div>
    </nav>

    <!-- Konten Spesifik Halaman (Disisipkan di sini) -->
    <main class="flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-navy-900 border-t border-navy-800 py-10 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-gray-400">
            <p>&copy; 2026 IFSEC LAB. Mohammad Bayu Anggara, S.Kom., M.Kom. All rights reserved.</p>
            <p class="text-sm mt-2">Platform Pelatihan Keamanan Web Terintegrasi. Gunakan hanya di lingkungan lab lokal.</p>
        </div>
    </footer>

</body>
</html>

{% extends "base.html" %}
{% block title %}Lab: Clickjacking Expert - IFSEC LAB{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-10">
    <div class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
        <div class="bg-navy-900 text-white px-6 py-3 flex justify-between items-center font-mono text-sm">
            <span>FUNDS TRANSFER</span>
            <span class="bg-green-500 text-white px-2 py-0.5 rounded text-xs font-bold animate-pulse">TARGET LIVE</span>
        </div>
        
        <div class="p-10 text-center">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Konfirmasi Transfer</h2>
            <p class="text-gray-600 mb-8">Anda akan mengirimkan dana kepada pengguna: <strong class="text-brand-blue">{{ to_account }}</strong></p>
            
            {% if message %}
            <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-6">
                {{ message }}
            </div>
            {% else %}
            <form method="POST">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition duration-300 shadow-md">
                    Konfirmasi Transfer
                </button>
            </form>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}

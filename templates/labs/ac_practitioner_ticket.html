{% extends "base.html" %}
{% block title %}Detail Tiket - IFSEC LAB{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-10">
    <div class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
        <div class="bg-navy-900 text-white px-6 py-3 flex justify-between items-center font-mono text-sm">
            <span>TICKET DETAILS #{{ ticket_id }}</span>
            <span class="bg-green-500 text-white px-2 py-0.5 rounded text-xs font-bold animate-pulse">TARGET LIVE</span>
        </div>
        <div class="p-8 sm:p-12">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">{{ ticket.title }}</h2>
            <p class="text-sm text-gray-500 mb-8 border-b pb-4">Dikirim oleh: <span class="font-bold text-brand-blue uppercase">{{ ticket.owner }}</span></p>
            
            <div class="bg-yellow-50 p-6 rounded-lg border border-yellow-200 text-gray-800 text-lg">
                "{{ ticket.body }}"
            </div>

            <div class="mt-8">
                <a href="/lab/access-control/practitioner" class="text-brand-blue hover:underline font-medium">&larr; Kembali ke Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Admin Panel - IFSEC LAB{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-10">
    <div class="bg-white rounded-xl shadow-lg border border-red-200 overflow-hidden">
        <div class="bg-red-900 text-white px-6 py-3 flex justify-between items-center font-mono text-sm">
            <span>SECRET ADMIN PANEL</span>
            <span class="bg-red-500 text-white px-2 py-0.5 rounded text-xs font-bold">RESTRICTED</span>
        </div>
        <div class="p-8 sm:p-12">
            <h2 class="text-3xl font-bold text-gray-800 mb-6 border-b pb-2">Manajemen Pengguna</h2>
            
            {% if message %}
            <div class="mb-6 bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-md font-bold">
                {{ message }}
            </div>
            {% endif %}

            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 border-b-2 border-gray-300">
                        <th class="p-3 font-bold text-gray-700">Username</th>
                        <th class="p-3 font-bold text-gray-700">Role</th>
                        <th class="p-3 font-bold text-gray-700">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b border-gray-200">
                        <td class="p-3 text-gray-800">wiener</td>
                        <td class="p-3 text-gray-500">User</td>
                        <td class="p-3"><button disabled class="bg-gray-300 text-gray-500 px-4 py-1 rounded text-sm cursor-not-allowed">Hapus</button></td>
                    </tr>
                    <tr class="border-b border-gray-200">
                        <td class="p-3 text-gray-800 font-bold">carlos</td>
                        <td class="p-3 text-gray-500">User</td>
                        <td class="p-3"><a href="?action=delete_carlos" class="bg-red-600 hover:bg-red-700 text-white px-4 py-1.5 rounded text-sm font-bold shadow transition">Hapus</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

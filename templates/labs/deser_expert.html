{% extends "base.html" %}
{% block title %}Lab: Deserialization Expert - IFSEC LAB{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-10">
    <a href="{{ url_for('tutorial', slug='deserialization', level='expert') }}" class="text-brand-blue hover:text-blue-700 font-medium mb-6 inline-flex items-center transition">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Kembali ke tutorial
    </a>

    <div class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
        <div class="bg-navy-900 text-white px-6 py-3 flex justify-between items-center font-mono text-sm">
            <span>YAML CONFIG PARSER</span>
            <span class="bg-green-500 text-white px-2 py-0.5 rounded text-xs font-bold animate-pulse">TARGET LIVE</span>
        </div>

        <div class="p-8 sm:p-12">
            <!-- PRATINJAU HASIL PARSING -->
            <div class="mb-8 p-6 rounded-lg border-2 shadow-sm 
                {% if color == 'blue' %} bg-blue-50 border-blue-200 text-blue-900 
                {% elif color == 'red' %} bg-red-50 border-red-200 text-red-900
                {% else %} bg-gray-50 border-gray-200 text-gray-900 {% endif %}">
                <h3 class="text-xl font-bold mb-2">Pratinjau Antarmuka:</h3>
                <!-- Hasil RCE eksploitasi YAML akan tercetak di {{ title }} -->
                <p class="font-mono text-lg break-words">{{ title }}</p> 
            </div>

            {% if error %}
            <div class="mb-6 bg-red-50 border border-red-300 p-4 rounded text-red-700 font-mono text-sm">
                {{ error }}
            </div>
            {% endif %}
            
            <form method="POST" action="/lab/deserialization/expert">
                <label class="block text-sm font-bold text-gray-700 mb-2">Pengaturan Tampilan (Format YAML):</label>
                <textarea name="yaml_config" rows="6" class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-brand-blue outline-none transition font-mono text-sm mb-4">{{ yaml_config }}</textarea>
                <button type="submit" class="bg-brand-blue hover:bg-blue-600 text-white font-bold py-2.5 px-8 rounded-md transition shadow-md">
                    Terapkan Konfigurasi
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
